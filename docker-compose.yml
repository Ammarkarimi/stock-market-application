services:
  stockkaro:
    build: .
    image: stockkaro
    ports:
      - '4000:4000'
    environment:
      # Demo accounts have published passwords: remove this line for anything other than a local demo.
      SEED_DEMO_DATA: 'true'
      # Plain HTTP on localhost. Set to true (the default in production) when serving over HTTPS.
      COOKIE_SECURE: 'false'
    volumes:
      - stockkaro-data:/data
    restart: unless-stopped

volumes:
  stockkaro-data:
