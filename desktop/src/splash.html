<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" />
    <title>StockKaro</title>
    <style>
      :root { color-scheme: light dark; --bg: #f5f6f8; --fg: #0f172a; --muted: #5b6577; --track: #e2e5ea; --primary: #4f46e5; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0d14; --fg: #e8ecf3; --muted: #9aa5b8; --track: #1f2633; --primary: #7c83f7; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      img { width: 88px; height: 88px; }
      h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--muted); font-size: 13px; }
      .bar { width: 160px; height: 4px; border-radius: 4px; background: var(--track); overflow: hidden; }
      .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 4px; background: var(--primary); animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.png" alt="" />
      <h1>StockKaro</h1>
      <div class="bar" role="progressbar" aria-label="Starting"></div>
      <p>Loading live market data…</p>
    </main>
  </body>
</html>
